<html>
<head>
  <meta name="viewport" content="width=device-width">
  <style>
    body { margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
    video { max-width: 100%; max-height: 100%; }
  </style>
</head>
<body>

  <video id="miVideo" controls autoplay playsinline>
    <source src="https://i.nuuls.com/_NbxQ.mp4" type="video/mp4">
  </video>

  <script>
    const video = document.getElementById('miVideo');

    // Configurar volumen al máximo (1.0 = 100%)
    video.volume = 1.0;

    function activarAudio() {
      video.muted = false;
      video.volume = 1.0;
      video.play();
      // Desactivar los detectores una vez encendido el audio
      ['click', 'touchstart', 'mousemove', 'scroll', 'keydown'].forEach(evt => {
        document.removeEventListener(evt, activarAudio);
      });
    }

    // Intentar reproducir directamente con sonido
    video.play().then(() => {
      video.muted = false;
      video.volume = 1.0;
    }).catch(() => {
      // Si el navegador lo frena, arranca silenciado y activa el audio en el primer micro-gesto
      video.muted = true;
      video.play();

      ['click', 'touchstart', 'mousemove', 'scroll', 'keydown'].forEach(evt => {
        document.addEventListener(evt, activarAudio, { once: true });
      });
    });
  </script>

</body>
</html>
