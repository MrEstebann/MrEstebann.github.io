<html>
<head>
  <meta name="viewport" content="width=device-width">
  <style>
    body { 
      margin: 0; 
      background-color: #000; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      overflow: hidden;
    }
    video { 
      max-width: 100%; 
      max-height: 100%; 
    }
  </style>
</head>
<body>

  <video id="miVideo" controls autoplay playsinline>
    <source src="https://i.nuuls.com/_NbxQ.mp4" type="video/mp4">
  </video>

  <script>
    const video = document.getElementById('miVideo');

    // Al reproducirse el video, desactiva el silencio y sube el volumen al 100%
    video.addEventListener('play', () => {
      video.muted = false;
      video.volume = 1.0;
    });

    // Forzar inicio instantáneo
    function forzarReproduccionConAudio() {
      video.muted = false;
      video.volume = 1.0;
      video.play();
    }

    // Intenta reproducir con sonido inmediatamente
    video.play().then(() => {
      video.muted = false;
      video.volume = 1.0;
    }).catch(() => {
      // Si el navegador requiere interacción previa, activa el audio al primer toque/clic
      ['click', 'touchstart', 'pointerdown'].forEach(evt => {
        document.addEventListener(evt, forzarReproduccionConAudio, { once: true });
      });
    });
  </script>

</body>
</html>
