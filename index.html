<html>
<head>
  <meta name="viewport" content="width=device-width">
  <style>
    body { margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
    #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10; }
    video { max-width: 100%; max-height: 100%; }
  </style>
</head>
<body>

  <div id="overlay"> Haz clic en cualquier lugar para reproducir con sonido </div>

  <video id="miVideo" controls playsinline>
    <source src="https://i.nuuls.com/_NbxQ.mp4" type="video/mp4">
  </video>

  <script>
    const overlay = document.getElementById('overlay');
    const video = document.getElementById('miVideo');

    overlay.addEventListener('click', () => {
      overlay.style.display = 'none';
      video.muted = false;
      video.play();
    });
  </script>

</body>
</html>
